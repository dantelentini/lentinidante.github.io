<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="apple-status-bar">
    <meta name="theme-color" content="#0064e6" id="theme-color-meta">
    <title>Dante Lentini</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <main>
        <canvas id="starfield" style="position:fixed;inset:0;z-index:0;pointer-events:none;display:none"></canvas>
        
        <!-- Content Display Areas -->
        <div class="content-grid" style="z-index:1">
            <div class="content-items" id="content-items">
                <!-- Content will be dynamically populated here -->
            </div>
        </div>
        
        <h1>Hi,</h1>
        <p>
            I like to <button id="read-btn">read</button>, <button id="write-btn">write</button>, and <button id="listen-btn">listen</button>.
        </p>
        <div class="text-links">
            <a href="http://thebooksireadinsteadofgoingtocollege.com" target="_blank" id="read-link">thebooksireadinsteadofgoingtocollege.com</a>
            <a href="http://thingsivechangedmymindon.com" target="_blank" id="write-link">thingsivechangedmymindon.com</a>
        </div>
        <p>
            I'm a <a href="https://dollarhomepage.com/" target="_blank" id="growth-hacker-link" class="growth-hacker-link">Growth Hacker</a>. In my past, I<br>
            left college, made <a href="https://www.tiktok.com/@thesitesupply" target="_blank" class="white">tiktoks</a> and joined<br>
            <a href="https://www.ycombinator.com/companies/hyper" target="_blank" class="white">startups</a>— all of which led me to SF,<br>
            where I'm now at <a href="https://f.inc/" target="_blank" class="white-bold">Founders, Inc.</a>
        </p>
        <div class="signature">
         MSHF,<br>
            Dante Lentini
        </div>
        <nav class="social-links">
            <a href="mailto:dantelentinics@gmail.com">Email</a>
            <a href="https://linkedin.com/in/dantelentini" target="_blank">LinkedIn</a>
            <a href="https://x.com/dantelentini" target="_blank">X</a>
            <a href="momsaidhavefun.pdf" target="_blank"><3</a>
            <a href="#" id="dark-mode-toggle">dark-mode.exe</a>
        </nav>
    </main>
    
    <!-- Audio element for music playback -->
    <audio id="audio-player" preload="metadata" crossorigin="anonymous" playsinline></audio>
    
    <script>
        // Theme init
        const rootEl = document.documentElement;
        let themeColorMeta = document.querySelector('meta[name="theme-color"]');
        const appleStatusBarMeta = document.getElementById('apple-status-bar');
        const THEME_KEY = 'theme-preference';
        const THEME_COLORS = { light: '#0064e6', dark: '#000000' };
        const DARK_MODE_DELAY_MS = 6300;
        const sfx = new Audio('assets/audio/dark-mode.mp3');
        sfx.preload = 'auto';
        sfx.crossOrigin = 'anonymous';
        sfx.volume = 1.0;
        const starCanvas = document.getElementById('starfield');
        if (starCanvas) starCanvas.style.display = 'none';
        let currentTheme = null;
        let pendingTheme = null;
        let themeTransitionTimer = null;
        applyTheme('light', { skipAudio: true });
        function syncSystemChrome(theme = 'light') {
            const color = THEME_COLORS[theme] || THEME_COLORS.light;
            const statusStyle = theme === 'dark' ? 'black' : 'default';
            
            if (themeColorMeta) {
                themeColorMeta.content = color;
            }
            
            if (appleStatusBarMeta) {
                appleStatusBarMeta.content = statusStyle;
            }
            
            // Force repaint
            setTimeout(() => {
                if (themeColorMeta) themeColorMeta.content = color;
                if (appleStatusBarMeta) appleStatusBarMeta.content = statusStyle;
            }, 10);
        }

        function applyTheme(theme, options = {}) {
            const next = theme === 'dark' ? 'dark' : 'light';
            const { skipAudio = false, force = false } = options;
            if (!force && currentTheme === next) {
                return;
            }

            currentTheme = next;

            if (next === 'dark') {
                rootEl.setAttribute('data-theme', 'dark');
                if (starCanvas) starCanvas.style.display = 'block';
            } else {
                rootEl.removeAttribute('data-theme');
                if (starCanvas) starCanvas.style.display = 'none';
            }

            syncSystemChrome(next);

            if (!skipAudio) {
                if (next === 'dark') {
                    playDarkModeSfx();
                } else {
                    stopDarkModeSfx();
                }
            }
        }

        function playDarkModeSfx() {
            try {
                sfx.currentTime = 0;
                sfx.play().catch(() => {});
            } catch (_) {}
        }

        function stopDarkModeSfx() {
            try {
                sfx.pause();
                sfx.currentTime = 0;
            } catch (_) {}
        }

        function cancelPendingTheme(options = {}) {
            const { stopAudio = true } = options;
            if (themeTransitionTimer) {
                clearTimeout(themeTransitionTimer);
                themeTransitionTimer = null;
            }
            if (stopAudio && pendingTheme === 'dark') {
                stopDarkModeSfx();
            }
            pendingTheme = null;
        }

        function startDarkModeTransition() {
            cancelPendingTheme();
            pendingTheme = 'dark';
            syncSystemChrome('dark');
            playDarkModeSfx();
            
            themeTransitionTimer = setTimeout(() => {
                cancelPendingTheme({ stopAudio: false });
                applyTheme('dark', { skipAudio: true });
                
                // Start flashing with dark mode audio BPM after theme is applied
                if (typeof startGrowthHackerFlash !== 'undefined') {
                    startGrowthHackerFlash(118);
                }
            }, DARK_MODE_DELAY_MS);
        }

        
        // Initialize Audio Context for better browser compatibility
        let audioContext = null;
        function initAudioContext() {
            if (!audioContext) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioContext = new AudioContext();
                } catch (e) {
                    // Web Audio API not supported
                }
            }
            // Resume if suspended (for autoplay policies)
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // Content data - only listen has visual content
        const listenData = [
            { image: 'assets/images/albums/album-01.jpg', title: 'Track 01', audio: 'assets/audio/track-01.mp3', bpm: 125 },
            { image: 'assets/images/albums/album-02.jpg', title: 'Track 02', audio: 'assets/audio/track-02.mp3', bpm: 140 },
            { image: 'assets/images/albums/album-03.jpg', title: 'Track 03', audio: 'assets/audio/track-03.mp3', bpm: 140 },
            { image: 'assets/images/albums/album-04.jpg', title: 'Track 04', audio: 'assets/audio/track-04.mp3', bpm: 119 },
            { image: 'assets/images/albums/album-05.jpg', title: 'Track 05', audio: 'assets/audio/track-05.mp3', bpm: 138 },
            { image: 'assets/images/albums/album-06.jpg', title: 'Track 06', audio: 'assets/audio/track-06.mp3', bpm: 138 },
            { image: 'assets/images/albums/album-07.jpg', title: 'Track 07', audio: 'assets/audio/track-07.mp3', bpm: 128 },
            { image: 'assets/images/albums/album-08.jpg', title: 'Track 08', audio: 'assets/audio/track-08.mp3', bpm: 97, gifImage: 'assets/images/albums/album-08-edit.gif' }
        ];

        // DOM elements
        const readBtn = document.getElementById('read-btn');
        const writeBtn = document.getElementById('write-btn');
        const listenBtn = document.getElementById('listen-btn');
        const contentItems = document.getElementById('content-items');
        const audioPlayer = document.getElementById('audio-player');
        const darkToggle = document.getElementById('dark-mode-toggle');
        const readLink = document.getElementById('read-link');
        const writeLink = document.getElementById('write-link');
        const growthHackerLink = document.getElementById('growth-hacker-link');

        let currentMode = null;
        let currentlyPlaying = null;
        let currentPlayingElement = null;
        let isButtonActive = false;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let audioUnlocked = false;
        let hasClickedListenBefore = false;
        let isReturningFromBackground = false;
        
        // Unlock audio on first user interaction (for autoplay policies)
        function unlockAudio() {
            if (!audioUnlocked) {
                initAudioContext();
                audioUnlocked = true;
                // Remove listener after first unlock
                document.removeEventListener('touchstart', unlockAudio);
                document.removeEventListener('click', unlockAudio);
            }
        }
        
        // Add listeners for audio unlock
        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });
        
        // Handle page visibility changes (tab switching on mobile)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Page is hidden (tab switched away or app backgrounded)
                // Don't pause audio, let it continue playing
            } else {
                // Page is visible again (tab switched back or app foregrounded)
                isReturningFromBackground = true;
                // Reset the flag after a short delay to prevent accidental triggers
                setTimeout(() => {
                    isReturningFromBackground = false;
                }, 1000);
            }
        });

        // Button event listeners
        readBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            
            if (currentMode === 'read' && isButtonActive) {
                // If same button is clicked and active, deactivate it
                hideContent();
            } else {
                isButtonActive = true;
                showContent('read');
            }
        });
        writeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            
            if (currentMode === 'write' && isButtonActive) {
                // If same button is clicked and active, deactivate it
                hideContent();
            } else {
                isButtonActive = true;
                showContent('write');
            }
        });
        listenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            
            if (currentMode === 'listen' && isButtonActive) {
                // If same button is clicked and active, deactivate it
                hideContent();
            } else {
                // Don't auto-play if returning from background to prevent spam
                const shouldAutoPlay = !hasClickedListenBefore && !isReturningFromBackground;
                
                isButtonActive = true;
                showContent('listen');
                
                // Auto-play track-1 only on the very first click (and not when returning from background)
                // Call playAudio synchronously just like tapping an album (works on iOS)
                if (shouldAutoPlay) {
                    hasClickedListenBefore = true;
                    const firstAlbum = contentItems.querySelector('.content-item:first-child');
                    if (firstAlbum && listenData[0]) {
                        const track = listenData[0];
                        playAudio(track.audio, firstAlbum, track.bpm);
                    }
                }
            }
        });

        let hoverTimeout = null;

        // Hover event listeners
        readBtn.addEventListener('mouseenter', () => {
            if (hoverTimeout) clearTimeout(hoverTimeout);
            if (!isButtonActive) {
                showContent('read');
            }
        });
        writeBtn.addEventListener('mouseenter', () => {
            if (hoverTimeout) clearTimeout(hoverTimeout);
            if (!isButtonActive) {
                showContent('write');
            }
        });
        listenBtn.addEventListener('mouseenter', () => {
            if (hoverTimeout) clearTimeout(hoverTimeout);
            if (!isButtonActive) {
                showContent('listen');
            }
        });

        // Mouse leave events to hide content when not hovering (only if no button is active)
        [readBtn, writeBtn, listenBtn].forEach(btn => {
            btn.addEventListener('mouseleave', () => {
                if (!isButtonActive) {
                    if (hoverTimeout) clearTimeout(hoverTimeout);
                    hoverTimeout = setTimeout(() => {
                        if (!isHoveringAnyButton() && !isButtonActive) {
                            hideContent();
                        }
                    }, 150);
                }
            });
        });

        // Click outside to deactivate button mode
        document.addEventListener('click', (e) => {
            // Don't hide content if clicking on album items, dark mode button, or any social links
            if (e.target.closest('.content-item') || 
                e.target.closest('#dark-mode-toggle') || 
                e.target.closest('.social-links') ||
                e.target === darkToggle ||
                darkToggle.contains(e.target)) {
                return;
            }
            
            // If clicking outside buttons, deactivate
            if (!readBtn.contains(e.target) && !writeBtn.contains(e.target) && !listenBtn.contains(e.target)) {
                isButtonActive = false;
                if (!isHoveringAnyButton()) {
                    hideContent();
                }
            }
        });

        function isHoveringAnyButton() {
            return readBtn.matches(':hover') || writeBtn.matches(':hover') || listenBtn.matches(':hover');
        }

        function showContent(mode) {
            // Remove active class from all buttons
            [readBtn, writeBtn, listenBtn].forEach(btn => btn.classList.remove('active'));
            
            // Add active class to current button
            document.getElementById(mode + '-btn').classList.add('active');

            // Update current mode
            currentMode = mode;

            // Hide all links first
            readLink.classList.remove('visible');
            writeLink.classList.remove('visible');

            // Show appropriate link for read or write
            if (mode === 'read') {
                readLink.classList.add('visible');
            } else if (mode === 'write') {
                writeLink.classList.add('visible');
            }

            // For listen mode, show the album content
            if (mode === 'listen') {
                contentItems.innerHTML = '';

                listenData.forEach((item, index) => {
                    const contentItem = document.createElement('div');
                    contentItem.className = 'content-item';
                    contentItem.dataset.bpm = item.bpm;
                    contentItem.innerHTML = `<img src="${item.image}" alt="${item.title}" title="${item.title}">`;
                    
                    contentItem.addEventListener('click', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        playAudio(item.audio, contentItem, item.bpm);
                        isButtonActive = true;
                    });
                    
                    contentItem.addEventListener('touchend', (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        playAudio(item.audio, contentItem, item.bpm);
                        isButtonActive = true;
                    });
                    
                    contentItems.appendChild(contentItem);
                    
                    // If this track is currently playing, restore spinning state and GIF
                    if (currentlyPlaying === item.audio && !audioPlayer.paused) {
                        contentItem.classList.add('spinning');
                        contentItem.style.opacity = '0.8';
                        currentPlayingElement = contentItem;
                        
                        // If this is album 8 and it's playing, use the GIF
                        if (item.gifImage) {
                            const img = contentItem.querySelector('img');
                            if (img) {
                                img.src = item.gifImage;
                            }
                        }
                    }
                });

                contentItems.setAttribute('data-mode', 'listen');
                contentItems.classList.add('active');
            } else {
                contentItems.classList.remove('active');
            }
        }

        function fadeOutContent(durationMs = 600) {
            if (!contentItems.classList.contains('active')) return;
            contentItems.classList.add('fade-out');
            setTimeout(() => {
                hideContent();
                contentItems.classList.remove('fade-out');
            }, durationMs);
        }

        function hideContent() {
            contentItems.classList.remove('active');
            [readBtn, writeBtn, listenBtn].forEach(btn => btn.classList.remove('active'));
            readLink.classList.remove('visible');
            writeLink.classList.remove('visible');
            currentMode = null;
            isButtonActive = false;
        }

        function restorePlaybackVisual(element) {
            if (!element) return;
            element.classList.remove('spinning');
            element.style.opacity = '';
            element.style.transform = '';
            
            // If this is album 8, restore the jpg version
            const img = element.querySelector('img');
            if (img && img.src.includes('album-08-edit.gif')) {
                img.src = 'assets/images/albums/album-08.jpg';
            }
        }

        function clearCurrentPlayingState(options = {}) {
            const { resetAudio = false, updateSession = true } = options;
            if (resetAudio) {
                audioPlayer.pause();
                audioPlayer.currentTime = 0;
            }
            restorePlaybackVisual(currentPlayingElement);
            currentlyPlaying = null;
            currentPlayingElement = null;
            stopDanceStyleFluctuation();
            stopGrowthHackerFlash();
            if (updateSession) {
                updateMediaSessionPlaybackState('none');
            }
        }

        // Growth Hacker flash control - works in both light and dark mode
        function startGrowthHackerFlash(bpm) {
            if (growthHackerLink) {
                // Flash in sync with music - one flash per beat
                const flashDuration = (60 / bpm); // Duration for one beat in seconds
                growthHackerLink.style.setProperty('--flash-duration', `${flashDuration}s`);
                growthHackerLink.classList.add('flashing');
            }
        }

        function stopGrowthHackerFlash() {
            if (growthHackerLink) {
                growthHackerLink.classList.remove('flashing');
            }
        }

        // Advanced dance system with coordination patterns
        let currentDanceStyle = 'smooth';
        let currentCoordMode = 'independent'; // 'independent', 'sync', 'mirror', 'pairs', 'wave'
        let styleChangeTimeout = null;
        let coordChangeTimeout = null;
        let hypeTimeout = null;
        let hypeInterval = null;
        
        function setCoordinationMode(mode) {
            currentCoordMode = mode;
            const albums = contentItems.querySelectorAll('.content-item:not(.spinning)');
            
            if (mode === 'sync') {
                // All dance in perfect sync - no delay
                albums.forEach(album => {
                    album.style.animationDelay = '0s';
                });
            } else if (mode === 'mirror') {
                // Left side mirrors right side
                albums.forEach((album, index) => {
                    if (index < 4) {
                        // Top row - left mirrors right
                        const mirrorIndex = 3 - index;
                        album.style.animationDelay = `${mirrorIndex * 0.2}s`;
                    } else {
                        // Bottom row - left mirrors right
                        const mirrorIndex = 7 - index;
                        album.style.animationDelay = `${mirrorIndex * 0.2}s`;
                    }
                });
            } else if (mode === 'pairs') {
                // Adjacent pairs hop together - mad funny and vibey
                albums.forEach((album, index) => {
                    // Pairs: 0&1, 2&3, 4&5, 6&7
                    const pairGroup = Math.floor(index / 2);
                    album.style.animationDelay = `${pairGroup * 0.25}s`;
                });
            } else if (mode === 'wave') {
                // Smooth wave pattern for swaying
                albums.forEach((album, index) => {
                    album.style.animationDelay = `${index * 0.12}s`;
                });
            } else {
                // Independent - each has unique offset
                albums.forEach((album, index) => {
                    album.style.animationDelay = `${index * 0.15}s`;
                });
            }
        }
        
        function triggerHypeMode() {
            // Find the spinning album position
            const spinningAlbum = contentItems.querySelector('.content-item.spinning');
            if (!spinningAlbum) return;
            
            const spinningIndex = Array.from(contentItems.children).indexOf(spinningAlbum);
            const albums = contentItems.querySelectorAll('.content-item:not(.spinning)');
            
            // Determine direction for each album to lean towards the spinning one
            albums.forEach((album, idx) => {
                // Remove previous hype classes
                album.classList.remove('hype-left', 'hype-right', 'hype-up', 'hype-down');
                
                // Find actual index in all albums
                const actualIndex = Array.from(contentItems.children).indexOf(album);
                
                // Determine direction to lean based on position relative to spinning album
                if (actualIndex < spinningIndex) {
                    // Album is to the left, lean right towards it
                    album.classList.add('hype-right');
                } else if (actualIndex > spinningIndex) {
                    // Album is to the right, lean left towards it
                    album.classList.add('hype-left');
                }
                
                // Add vertical lean based on row
                if (actualIndex < 4 && spinningIndex >= 4) {
                    album.classList.add('hype-down');
                } else if (actualIndex >= 4 && spinningIndex < 4) {
                    album.classList.add('hype-up');
                }
            });
            
            // Activate hype mode
            contentItems.classList.add('hype-mode');
            
            // Deactivate after 4 seconds
            if (hypeTimeout) clearTimeout(hypeTimeout);
            hypeTimeout = setTimeout(() => {
                contentItems.classList.remove('hype-mode');
                albums.forEach(album => {
                    album.classList.remove('hype-left', 'hype-right', 'hype-up', 'hype-down');
                });
            }, 4000);
        }
        
        function scheduleRandomHype(bpm) {
            // Schedule next hype moment randomly (every 24-48 beats)
            const baseBeats = 24 + Math.floor(Math.random() * 24);
            const duration = ((60 / bpm) * 1000) * baseBeats;
            hypeInterval = setTimeout(() => {
                triggerHypeMode();
                scheduleRandomHype(bpm);
            }, duration);
        }
        
        function cycleCoordinationMode(bpm) {
            // Cycle through coordination modes with smart transitions
            const modes = ['independent', 'sync', 'pairs', 'mirror', 'wave'];
            
            // Pick next mode randomly but not the same as current
            let nextMode;
            do {
                nextMode = modes[Math.floor(Math.random() * modes.length)];
            } while (nextMode === currentCoordMode);
            
            setCoordinationMode(nextMode);
            
            // Stay in each mode for 12-24 beats
            const baseBeats = 12 + Math.floor(Math.random() * 12);
            const duration = ((60 / bpm) * 1000) * baseBeats;
            coordChangeTimeout = setTimeout(() => cycleCoordinationMode(bpm), duration);
        }
        
        function switchDanceStyle(bpm) {
            // Alternate between smooth and jump
            currentDanceStyle = currentDanceStyle === 'smooth' ? 'jump' : 'smooth';
            contentItems.setAttribute('data-dance-style', currentDanceStyle);
            
            // Random duration: 12-24 beats
            const baseBeats = 12 + Math.floor(Math.random() * 12);
            const duration = ((60 / bpm) * 1000) * baseBeats;
            styleChangeTimeout = setTimeout(() => switchDanceStyle(bpm), duration);
        }
        
        function startDanceStyleFluctuation(bpm) {
            // Stop any existing timeouts
            if (styleChangeTimeout) {
                clearTimeout(styleChangeTimeout);
                styleChangeTimeout = null;
            }
            if (coordChangeTimeout) {
                clearTimeout(coordChangeTimeout);
                coordChangeTimeout = null;
            }
            if (hypeInterval) {
                clearTimeout(hypeInterval);
                hypeInterval = null;
            }
            if (hypeTimeout) {
                clearTimeout(hypeTimeout);
                hypeTimeout = null;
            }
            
            // Start with smooth and independent mode
            currentDanceStyle = 'smooth';
            currentCoordMode = 'independent';
            contentItems.setAttribute('data-dance-style', 'smooth');
            setCoordinationMode('independent');
            
            // Schedule first dance style switch
            const styleBeats = 12 + Math.floor(Math.random() * 12);
            const styleDuration = ((60 / bpm) * 1000) * styleBeats;
            styleChangeTimeout = setTimeout(() => switchDanceStyle(bpm), styleDuration);
            
            // Schedule first coordination mode switch
            const coordBeats = 16 + Math.floor(Math.random() * 16);
            const coordDuration = ((60 / bpm) * 1000) * coordBeats;
            coordChangeTimeout = setTimeout(() => cycleCoordinationMode(bpm), coordDuration);
            
            // Schedule first hype moment
            scheduleRandomHype(bpm);
        }
        
        function stopDanceStyleFluctuation() {
            if (styleChangeTimeout) {
                clearTimeout(styleChangeTimeout);
                styleChangeTimeout = null;
            }
            if (coordChangeTimeout) {
                clearTimeout(coordChangeTimeout);
                coordChangeTimeout = null;
            }
            if (hypeInterval) {
                clearTimeout(hypeInterval);
                hypeInterval = null;
            }
            if (hypeTimeout) {
                clearTimeout(hypeTimeout);
                hypeTimeout = null;
            }
            contentItems.classList.remove('hype-mode');
            contentItems.removeAttribute('data-dance-style');
            currentDanceStyle = 'smooth';
            currentCoordMode = 'independent';
        }

        function playAudio(audioSrc, element, bpm) {
            if (pendingTheme === 'dark') {
                return;
            }
            // Initialize audio context on first user interaction
            initAudioContext();
            
            // Stop dark mode sound effect when playing a song after transition
            const isDark = currentTheme === 'dark';
            if (isDark) {
                try {
                    if (!sfx.paused) {
                        sfx.pause();
                        sfx.currentTime = 0;
                    }
                } catch (_) {}
            }
            
            // If clicking the same track, toggle play/pause
            if (currentlyPlaying === audioSrc) {
                if (!audioPlayer.paused) {
                    audioPlayer.pause();
                    updateMediaSessionPlaybackState('paused');
                    stopDanceStyleFluctuation();
                    stopGrowthHackerFlash();
                    // When paused, stop spinning and restore CSS rotation
                    restorePlaybackVisual(element);
                } else {
                    // Resume playback
                    const playPromise = audioPlayer.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            updateMediaSessionPlaybackState('playing');
                            // Set BPM for dancing animation
                            if (bpm && contentItems) {
                                const danceSpeed = (240 / bpm); // 4 beats in seconds
                                contentItems.style.setProperty('--dance-duration', `${danceSpeed}s`);
                                startDanceStyleFluctuation(bpm);
                                startGrowthHackerFlash(bpm);
                            }
                            // When playing, add spinning class and dim slightly
                            if (element) {
                                element.classList.add('spinning');
                                element.style.opacity = '0.8';
                                
                                // If this is album 8, switch to the gif version
                                const trackInfo = listenData.find(track => track.audio === audioSrc);
                                if (trackInfo && trackInfo.gifImage) {
                                    const img = element.querySelector('img');
                                    if (img) {
                                        img.src = trackInfo.gifImage;
                                    }
                                }
                            }
                        }).catch(error => {
                            // Resume failed
                        });
                    }
                }
                return;
            }

            // Reset ONLY the previous playing element (not all albums)
            if (currentPlayingElement && currentPlayingElement !== element) {
                restorePlaybackVisual(currentPlayingElement);
                currentPlayingElement = null;
            }

            // Stop currently playing audio and start new one
            if (currentlyPlaying) {
                clearCurrentPlayingState({ resetAudio: true });
            }

            // Set BPM for dancing animation - calculate duration for 4-beat cycle
            if (bpm && contentItems) {
                const danceSpeed = (240 / bpm); // 4 beats in seconds
                contentItems.style.setProperty('--dance-duration', `${danceSpeed}s`);
                // Start dancing immediately when new track plays
                startDanceStyleFluctuation(bpm);
                startGrowthHackerFlash(bpm);
            }

            // Find track info for Media Session API
            const trackInfo = listenData.find(track => track.audio === audioSrc);
            
            // Start new audio
            attemptAudioPlay(audioSrc, element, trackInfo);
        }
        
        function attemptAudioPlay(audioSrc, element, trackInfo) {
            // Set audio source and properties
            audioPlayer.src = audioSrc;
            audioPlayer.volume = 1.0;
            audioPlayer.preload = 'auto';
            
            // Load and play immediately
            audioPlayer.load();
            
            // Add loading visual feedback
            if (element) {
                element.style.opacity = '0.6';
            }
            
            // Play as soon as possible
            const playPromise = audioPlayer.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    currentlyPlaying = audioSrc;
                    currentPlayingElement = element;
                    
                    // Update Media Session API (for lock screen controls, notifications)
                    updateMediaSession(trackInfo);
                    
                    // Start growth hacker flash if we have track info
                    if (trackInfo && trackInfo.bpm) {
                        startGrowthHackerFlash(trackInfo.bpm);
                    }
                    
                    // Visual feedback for successful playback - add spinning animation and dim slightly
                    if (element) {
                        element.classList.add('spinning');
                        element.style.opacity = '0.8';
                        
                        // If this is album 8, switch to the gif version
                        if (trackInfo && trackInfo.gifImage) {
                            const img = element.querySelector('img');
                            if (img) {
                                img.src = trackInfo.gifImage;
                            }
                        }
                    }
                }).catch(error => {
                    // Playback failed - retry once after a brief delay
                    setTimeout(() => {
                        audioPlayer.play().then(() => {
                            currentlyPlaying = audioSrc;
                            currentPlayingElement = element;
                            updateMediaSession(trackInfo);
                            if (trackInfo && trackInfo.bpm) {
                                startGrowthHackerFlash(trackInfo.bpm);
                            }
                            if (element) {
                                element.classList.add('spinning');
                                element.style.opacity = '0.8';
                                
                                // If this is album 8, switch to the gif version
                                if (trackInfo && trackInfo.gifImage) {
                                    const img = element.querySelector('img');
                                    if (img) {
                                        img.src = trackInfo.gifImage;
                                    }
                                }
                            }
                        }).catch(() => {
                            // Show visual feedback that audio failed
                            if (element) {
                                element.style.opacity = '0.5';
                                setTimeout(() => {
                                    element.style.opacity = '';
                                    element.style.transform = '';
                                }, 300);
                            }
                        });
                    }, 100);
                });
            }
        }
        
        // Update Media Session API for rich media controls
        function updateMediaSession(trackInfo) {
            if ('mediaSession' in navigator && trackInfo) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: trackInfo.title,
                    artist: 'Dante Lentini',
                    album: 'My Playlist',
                    artwork: [
                        { src: trackInfo.image, sizes: '512x512', type: 'image/jpeg' }
                    ]
                });
                
                // Set up media session action handlers
                navigator.mediaSession.setActionHandler('play', () => {
                    audioPlayer.play();
                });
                
                navigator.mediaSession.setActionHandler('pause', () => {
                    audioPlayer.pause();
                });
                
                navigator.mediaSession.setActionHandler('stop', () => {
                    clearCurrentPlayingState({ resetAudio: true });
                });
                
                // Update playback state
                updateMediaSessionPlaybackState('playing');
            }
        }
        
        function updateMediaSessionPlaybackState(state) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = state;
            }
        }

        // Handle audio events
        audioPlayer.addEventListener('ended', () => {
            clearCurrentPlayingState();
        });

        audioPlayer.addEventListener('error', () => {
            clearCurrentPlayingState();
        });
        
        // Additional event listeners for better playback state management
        audioPlayer.addEventListener('play', () => {
            updateMediaSessionPlaybackState('playing');
        });
        
        audioPlayer.addEventListener('pause', () => {
            if (currentlyPlaying) {
                updateMediaSessionPlaybackState('paused');
            }
        });
        

        // Dark mode toggle
        darkToggle.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            if (pendingTheme === 'dark') {
                cancelPendingTheme();
                applyTheme('light', { force: true });
                stopGrowthHackerFlash();
                return;
            }

            const next = currentTheme === 'dark' ? 'light' : 'dark';

            if (next === 'dark') {
                // Close listen tab if open
                if (currentMode === 'listen') {
                    hideContent();
                }
                
                if (audioPlayer && !audioPlayer.paused) {
                    clearCurrentPlayingState({ resetAudio: true });
                }
                startDarkModeTransition();
            } else {
                cancelPendingTheme();
                applyTheme('light', { force: currentTheme === 'light' });
                stopGrowthHackerFlash();
            }
        });

        // Starfield animation (enabled in dark mode)
        (function initStarfield(){
            const canvas = document.getElementById('starfield');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let stars = [];
            let meteors = [];
            function resize(){
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                stars = Array.from({length: Math.floor((canvas.width*canvas.height)/9000)}, () => ({
                    x: Math.random()*canvas.width,
                    y: Math.random()*canvas.height,
                    tw: Math.random()*Math.PI*2,
                    sp: 0.5 + Math.random()*0.5,
                    r: 0.6 + Math.random()*1.2
                }));
            }
            window.addEventListener('resize', resize);
            resize();
            function tick(){
                if (canvas.style.display !== 'block') { requestAnimationFrame(tick); return; }
                ctx.clearRect(0,0,canvas.width,canvas.height);
                // twinkle stars
                for (const s of stars){
                    s.tw += 0.02*s.sp;
                    const alpha = 0.3 + 0.7*(0.5+0.5*Math.sin(s.tw));
                    ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                    ctx.fill();
                }
                // meteors
                if (Math.random()<0.01 && meteors.length<2){
                    meteors.push({x: Math.random()*canvas.width, y: -20, vx: -6-Math.random()*4, vy: 10+Math.random()*6, life: 1});
                }
                for (let i=meteors.length-1;i>=0;i--){
                    const m = meteors[i];
                    m.x += m.vx; m.y += m.vy; m.life -= 0.01;
                    const grad = ctx.createLinearGradient(m.x, m.y, m.x-m.vx*6, m.y-m.vy*6);
                    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(m.x, m.y);
                    ctx.lineTo(m.x-m.vx*6, m.y-m.vy*6);
                    ctx.stroke();
                    if (m.life<=0 || m.y>canvas.height+50) meteors.splice(i,1);
                }
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        })();

    </script>
</body>
